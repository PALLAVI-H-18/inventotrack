$kind: http-request
name: "Staff: record a sale ALLOWED (201)"
description: sold_by is taken from the token automatically.
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "quantity_sold": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 8000
