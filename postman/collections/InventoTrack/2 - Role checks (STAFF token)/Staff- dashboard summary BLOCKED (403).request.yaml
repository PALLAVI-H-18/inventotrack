$kind: http-request
name: "Staff: dashboard summary BLOCKED (403)"
url: "{{base_url}}/dashboard/summary"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000
