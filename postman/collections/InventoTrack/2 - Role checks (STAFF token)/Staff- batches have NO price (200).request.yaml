$kind: http-request
name: "Staff: batches have NO price (200)"
description: "Check the response: price_per_unit must be missing."
url: "{{base_url}}/products/1/batches"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
