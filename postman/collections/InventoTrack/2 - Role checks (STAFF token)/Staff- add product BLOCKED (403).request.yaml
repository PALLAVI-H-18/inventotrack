$kind: http-request
name: "Staff: add product BLOCKED (403)"
url: "{{base_url}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test"
    }
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 1000
