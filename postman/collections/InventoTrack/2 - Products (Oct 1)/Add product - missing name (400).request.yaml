$kind: http-request
description: "Validation: name is required."
url: "{{base_url}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Test",
      "category": "Insecticide"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
