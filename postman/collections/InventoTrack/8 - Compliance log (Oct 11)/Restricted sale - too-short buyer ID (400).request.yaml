$kind: http-request
description: Buyer ID must be at least 4 characters.
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 7,
      "quantity_sold": 1,
      "buyer_id_proof": "abc"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
