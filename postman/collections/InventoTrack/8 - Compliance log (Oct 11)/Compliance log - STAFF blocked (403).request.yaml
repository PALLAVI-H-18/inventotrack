$kind: http-request
url: "{{base_url}}/reports/restricted-sales"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 8000
