$kind: http-request
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Dup",
      "email": "staff@inventotrack.com",
      "password": "secret1"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 2000
