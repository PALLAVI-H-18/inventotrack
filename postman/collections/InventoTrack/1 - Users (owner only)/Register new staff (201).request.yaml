$kind: http-request
description: Uses a unique email each run so it always succeeds.
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Staff",
      "email": "staff{{$timestamp}}@shop.com",
      "password": "secret1"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
