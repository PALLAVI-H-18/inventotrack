$kind: http-request
url: "{{base_url}}/batches"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "supplier_id": 1,
      "batch_no": "B041",
      "quantity_received": 60,
      "price_per_unit": 420,
      "purchase_date": "2026-09-25",
      "expiry_date": "2027-06-30"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
