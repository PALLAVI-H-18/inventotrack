$kind: http-request
url: "{{base_url}}/suggestions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Has summary', function () { pm.expect(pm.response.json().summary.total_products).to.be.above(0); });
    language: text/javascript
order: 3000
