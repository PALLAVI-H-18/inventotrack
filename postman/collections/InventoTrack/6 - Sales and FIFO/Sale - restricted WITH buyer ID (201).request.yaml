$kind: http-request
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 22,
      "quantity_sold": 2,
      "buyer_id_proof": "Aadhaar: XXXX-XXXX-1234"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 6000
