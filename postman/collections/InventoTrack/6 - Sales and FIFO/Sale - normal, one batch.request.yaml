$kind: http-request
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "quantity_sold": 8
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
