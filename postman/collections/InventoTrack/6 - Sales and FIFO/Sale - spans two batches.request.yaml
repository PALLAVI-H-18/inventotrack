$kind: http-request
description: Works when the oldest valid batch holds fewer units than the quantity sold.
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 20,
      "quantity_sold": 10
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 2000
