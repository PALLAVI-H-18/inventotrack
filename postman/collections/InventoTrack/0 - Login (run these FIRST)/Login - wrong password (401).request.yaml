$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "owner@inventotrack.com",
      "password": "wrong"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
