$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "owner@inventotrack.com"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
