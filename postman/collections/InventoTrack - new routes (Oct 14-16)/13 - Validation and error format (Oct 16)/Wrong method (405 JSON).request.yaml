$kind: http-request
url: "{{base_url}}/products"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 405', function () { pm.response.to.have.status(405); });
      pm.test('Error format is {error, details?}', function () { const j = pm.response.json(); pm.expect(j.error).to.be.a('string'); pm.expect(Object.keys(j).every(k => ['error','details'].includes(k))).to.be.true; });
    language: text/javascript
order: 11000
