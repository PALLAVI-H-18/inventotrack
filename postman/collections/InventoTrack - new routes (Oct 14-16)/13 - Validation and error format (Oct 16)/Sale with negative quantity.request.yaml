$kind: http-request
url: "{{base_url}}/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "quantity_sold": -2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', function () { pm.response.to.have.status(400); });
      pm.test('Error format is {error, details?}', function () { const j = pm.response.json(); pm.expect(j.error).to.be.a('string'); pm.expect(Object.keys(j).every(k => ['error','details'].includes(k))).to.be.true; });
    language: text/javascript
order: 6000
